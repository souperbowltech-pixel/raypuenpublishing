name: NC playback acceptance

on:
  push:
    paths:
      - 'scripts/verify-nc-portals.py'
      - '.github/workflows/nc-playback.yml'

permissions:
  contents: read

concurrency:
  group: nc-playback-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nc-playback:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install project and browser tools
        run: |
          npm ci
          python3 -m venv /tmp/nc-browser-tools
          /tmp/nc-browser-tools/bin/pip install -r scripts/requirements-browser.txt
          /tmp/nc-browser-tools/bin/python -m playwright install --with-deps chromium
      - name: Start isolated preview
        run: |
          node node_modules/next/dist/bin/next dev --hostname 127.0.0.1 --port 3000 > /tmp/nc-preview.log 2>&1 &
          echo $! > /tmp/nc-preview.pid
          for attempt in $(seq 1 60); do
            if curl --connect-timeout 2 --max-time 10 --silent --fail http://localhost:3000/nc/welcome > /dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/nc-preview.log
          exit 1
      - name: Verify actual five-video playback and portal behavior
        run: /tmp/nc-browser-tools/bin/python scripts/verify-nc-portals.py --output artifacts/nc-playback
      - name: Stop owned preview
        if: always()
        run: |
          if test -f /tmp/nc-preview.pid; then kill "$(cat /tmp/nc-preview.pid)" || true; fi
      - name: Save playback evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nc-playback-evidence
          path: artifacts/nc-playback
          if-no-files-found: warn
